name: Release Windows Executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests before packaging
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v

      - name: Build standalone ColabModelHub.exe
        run: |
          python -m PyInstaller `
            --name="ColabModelHub" `
            --windowed `
            --onefile `
            --clean `
            --icon="gui/assets/app.ico" `
            --add-data="gui;gui" `
            --collect-data="colab_cli" `
            app.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ColabModelHub.exe
          generate_release_notes: true
